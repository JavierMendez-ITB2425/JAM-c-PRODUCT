version: '3'
services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: nodo-hls
    ports:
      - "1935:1935"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    # 300 Megabytes de RAM dedicados al vídeo
    tmpfs:
      - /tmp/hls:size=300m
    restart: unless-stopped