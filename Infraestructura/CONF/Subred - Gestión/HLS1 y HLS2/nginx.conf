worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        application live {
            live on;
            hls on;

            # La ruta donde se guardará el vídeo (nuestra futura RAM)
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
        }
    }
}

http {
    server {
        listen 80;

        location / {
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';

            # Exponemos la carpeta de la RAM hacia Internet
            alias /tmp/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}
